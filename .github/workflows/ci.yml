name: RAG Evaluation CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  fast-checks:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Pytest
      run: |
        pytest tests/
        
    - name: Run Deterministic Retrieval Evaluation
      run: |
        python eval/retrieval_eval.py

  ragas-eval:
    runs-on: ubuntu-latest
    needs: fast-checks
    # Only run on main or if PR has label 'run-eval' to save LLM costs
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'run-eval')
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Ragas Evaluation
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        python eval/ragas_eval.py

  deploy-render:
    runs-on: ubuntu-latest
    needs: [fast-checks, ragas-eval]
    if: github.ref == 'refs/heads/main'
    steps:
    - name: Trigger Render Deploy Hook
      run: |
        curl -f -X GET "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  deploy-vercel:
    runs-on: ubuntu-latest
    needs: [fast-checks, ragas-eval]
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v3

    - name: Deploy to Vercel
      uses: amondnet/vercel-action@v20
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        vercel-args: '--prod'
        working-directory: ./frontend

