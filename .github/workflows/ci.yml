name: RAG Evaluation & Smart Deployment CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read

env:
  PYTHONPATH: .

jobs:
  detect-changes:
    name: 🔍 Detect Changed Components
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      backend_deps: ${{ steps.filter.outputs.backend_deps }}
      eval_pipeline: ${{ steps.filter.outputs.eval_pipeline }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        filters: |
          backend:
            - 'src/**'
            - 'tests/**'
            - 'data/**'
          backend_deps:
            - 'requirements.txt'
            - 'Dockerfile'
            - 'docker-compose.yml'
          eval_pipeline:
            - 'eval/**'
            - 'docs/corpus/**'
          frontend:
            - 'frontend/**'

  fast-checks:
    name: ⚡ Fast Unit & Retrieval Checks
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.backend_deps == 'true' || needs.detect-changes.outputs.eval_pipeline == 'true' || github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: 'requirements.txt'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Pytest Test Suite
      run: |
        pytest tests/ -v
        
    - name: Run Deterministic Retrieval Evaluation
      run: |
        python eval/retrieval_eval.py

  ragas-eval:
    name: 🎯 Ragas LLM Evaluation
    runs-on: ubuntu-latest
    needs: [detect-changes, fast-checks]
    if: (github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'run-eval')) && (needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.backend_deps == 'true' || needs.detect-changes.outputs.eval_pipeline == 'true' || github.ref == 'refs/heads/main')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: 'requirements.txt'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Ragas Evaluation
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        python eval/ragas_eval.py

  deploy-render:
    name: 🚀 Deploy Backend to Render
    runs-on: ubuntu-latest
    needs: [detect-changes, fast-checks, ragas-eval]
    if: |
      always() && 
      github.ref == 'refs/heads/main' && 
      (needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.backend_deps == 'true') &&
      (needs.fast-checks.result == 'success' || needs.fast-checks.result == 'skipped') &&
      (needs.ragas-eval.result == 'success' || needs.ragas-eval.result == 'skipped')
    steps:
    - name: Inspect Change Type
      run: |
        if [ "${{ needs.detect-changes.outputs.backend_deps }}" = "true" ]; then
          echo "📦 Dependency / Dockerfile changes detected -> Full container rebuild triggered on Render."
        else
          echo "⚡ Backend application code changes detected -> Live service update triggered on Render."
        fi

    - name: Trigger Render Deploy Hook
      run: |
        curl -f -X GET "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  deploy-vercel:
    name: 🌐 Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: [detect-changes, fast-checks, ragas-eval]
    if: |
      always() && 
      github.ref == 'refs/heads/main' && 
      needs.detect-changes.outputs.frontend == 'true' &&
      (needs.fast-checks.result == 'success' || needs.fast-checks.result == 'skipped') &&
      (needs.ragas-eval.result == 'success' || needs.ragas-eval.result == 'skipped')
    steps:
    - uses: actions/checkout@v4

    - name: Deploy to Vercel
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      run: npx vercel --prod --token=$VERCEL_TOKEN --yes
